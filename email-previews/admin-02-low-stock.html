<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Preview: Email Admin - Stock Bajo</title>
</head>

<body
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background-color: #0a0a0f;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #0f0f1a;">
        <!-- Header -->
        <div style="background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); padding: 40px; text-align: center;">
            <div
                style="width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 auto 16px;">
                <table width="60" height="60">
                    <tr>
                        <td align="center" valign="middle" style="color: white; font-size: 28px;">⚠️</td>
                    </tr>
                </table>
            </div>
            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 700;">Alerta de Stock Bajo</h1>
            <p style="color: rgba(255,255,255,0.9); margin: 10px 0 0 0; font-size: 14px;">3 producto(s) necesitan
                reposición</p>
        </div>

        <!-- Content -->
        <div style="padding: 32px;">
            <!-- Products Table -->
            <div style="background: #0a0a0f; border: 1px solid #2a2a3e; border-radius: 12px; padding: 20px;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th
                                style="padding: 12px; text-align: left; color: #71717a; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #2a2a3e;">
                                Producto</th>
                            <th
                                style="padding: 12px; text-align: center; color: #71717a; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #2a2a3e;">
                                Talla</th>
                            <th
                                style="padding: 12px; text-align: center; color: #71717a; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #2a2a3e;">
                                Stock</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="padding: 12px; border-bottom: 1px solid #2a2a3e; color: #e2e8f0;">Camisa Oxford
                                Blanca</td>
                            <td
                                style="padding: 12px; border-bottom: 1px solid #2a2a3e; color: #71717a; text-align: center;">
                                M</td>
                            <td style="padding: 12px; border-bottom: 1px solid #2a2a3e; text-align: center;">
                                <span
                                    style="background: #f59e0b; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;">3
                                    unidades</span>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border-bottom: 1px solid #2a2a3e; color: #e2e8f0;">Pantalón Chino
                                Azul</td>
                            <td
                                style="padding: 12px; border-bottom: 1px solid #2a2a3e; color: #71717a; text-align: center;">
                                L</td>
                            <td style="padding: 12px; border-bottom: 1px solid #2a2a3e; text-align: center;">
                                <span
                                    style="background: #dc2626; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;">AGOTADO</span>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 12px; border-bottom: 1px solid #2a2a3e; color: #e2e8f0;">Corbata Seda
                                Burdeos</td>
                            <td
                                style="padding: 12px; border-bottom: 1px solid #2a2a3e; color: #71717a; text-align: center;">
                                Única</td>
                            <td style="padding: 12px; border-bottom: 1px solid #2a2a3e; text-align: center;">
                                <span
                                    style="background: #f59e0b; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;">2
                                    unidades</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- CTA Button -->
            <div style="text-align: center; margin-top: 24px;">
                <a href="#"
                    style="display: inline-block; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: white; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 14px;">
                    Gestionar Inventario
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div
            style="background: #0a0a0f; padding: 24px; text-align: center; border-top: 1px solid #2a2a3e; color: #71717a; font-size: 12px;">
            FashionMarket Admin • 19 ene 2026, 09:45
        </div>
    </div>
</body>

</html>
