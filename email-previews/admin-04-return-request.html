<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Preview: Email Admin - Solicitud Devolución</title>
</head>

<body
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background-color: #0a0a0f;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #0f0f1a;">
        <!-- Header -->
        <div style="background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%); padding: 40px; text-align: center;">
            <div
                style="width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 auto 16px;">
                <table width="60" height="60">
                    <tr>
                        <td align="center" valign="middle" style="color: white; font-size: 28px;">↩️</td>
                    </tr>
                </table>
            </div>
            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 700;">Solicitud de Devolución</h1>
            <p style="color: rgba(255,255,255,0.9); margin: 10px 0 0 0; font-size: 14px;">Requiere revisión</p>
        </div>

        <!-- Content -->
        <div style="padding: 32px;">
            <!-- Order Card -->
            <div
                style="background: #0a0a0f; border: 1px solid #2a2a3e; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
                <table width="100%">
                    <tr>
                        <td width="50%">
                            <p
                                style="color: #71717a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 4px 0;">
                                Pedido</p>
                            <p style="color: #f1f5f9; font-size: 16px; font-weight: 600; margin: 0;">#18</p>
                        </td>
                        <td width="50%">
                            <p
                                style="color: #71717a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 4px 0;">
                                Cliente</p>
                            <p style="color: #f1f5f9; font-size: 16px; font-weight: 600; margin: 0;">Pedro Sánchez</p>
                            <p style="color: #71717a; font-size: 13px; margin: 2px 0 0 0;">pedro@example.com</p>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- Reason Card -->
            <div
                style="background: #0a0a0f; border: 1px solid #2a2a3e; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
                <p
                    style="color: #71717a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px 0;">
                    Motivo de devolución</p>
                <p style="color: #e2e8f0; margin: 0; line-height: 1.6;">La talla no me queda bien, necesito una talla
                    más grande. El producto está en perfectas condiciones sin usar.</p>
            </div>

            <!-- CTA Button -->
            <div style="text-align: center; margin-top: 24px;">
                <a href="#"
                    style="display: inline-block; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: white; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 14px;">
                    Revisar Solicitud
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div
            style="background: #0a0a0f; padding: 24px; text-align: center; border-top: 1px solid #2a2a3e; color: #71717a; font-size: 12px;">
            FashionMarket Admin • 19 ene 2026, 11:15
        </div>
    </div>
</body>

</html>
