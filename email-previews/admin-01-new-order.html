<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Preview: Email Admin - Nuevo Pedido</title>
</head>

<body
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background-color: #0a0a0f;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #0f0f1a;">
        <!-- Header -->
        <div style="background: linear-gradient(135deg, #059669 0%, #10b981 100%); padding: 40px; text-align: center;">
            <div
                style="width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 50%; margin: 0 auto 16px;">
                <table width="60" height="60">
                    <tr>
                        <td align="center" valign="middle" style="color: white; font-size: 28px;">🛒</td>
                    </tr>
                </table>
            </div>
            <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: 700;">Nuevo Pedido Recibido</h1>
            <p style="color: rgba(255,255,255,0.9); margin: 10px 0 0 0; font-size: 14px;">Pedido #21</p>
        </div>

        <!-- Content -->
        <div style="padding: 32px;">
            <!-- Order Card -->
            <div
                style="background: #0a0a0f; border: 1px solid #2a2a3e; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
                <table width="100%">
                    <tr>
                        <td>
                            <p
                                style="color: #71717a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 4px 0;">
                                Cliente</p>
                            <p style="color: #f1f5f9; font-size: 16px; font-weight: 600; margin: 0;">José Manuel López
                            </p>
                            <p style="color: #71717a; font-size: 13px; margin: 2px 0 0 0;">josemanuel@example.com</p>
                        </td>
                        <td style="text-align: right;">
                            <p
                                style="color: #71717a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 4px 0;">
                                Total</p>
                            <p style="color: #22d3ee; font-size: 24px; font-weight: 700; margin: 0;">349,99 €</p>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- Products Card -->
            <div
                style="background: #0a0a0f; border: 1px solid #2a2a3e; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
                <p
                    style="color: #71717a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 12px 0;">
                    Productos</p>
                <table style="width: 100%; border-collapse: collapse;">
                    <tr>
                        <td style="padding: 8px 0; border-bottom: 1px solid #2a2a3e; color: #e2e8f0;">Traje Slim Fit
                            Gris</td>
                        <td
                            style="padding: 8px 0; border-bottom: 1px solid #2a2a3e; color: #71717a; text-align: center;">
                            1</td>
                        <td
                            style="padding: 8px 0; border-bottom: 1px solid #2a2a3e; color: #22d3ee; text-align: right;">
                            349,99 €</td>
                    </tr>
                </table>
            </div>

            <!-- CTA Button -->
            <div style="text-align: center; margin-top: 24px;">
                <a href="#"
                    style="display: inline-block; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: white; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 14px;">
                    Ver Pedido en Admin
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div
            style="background: #0a0a0f; padding: 24px; text-align: center; border-top: 1px solid #2a2a3e; color: #71717a; font-size: 12px;">
            FashionMarket Admin • 19 ene 2026, 09:45
        </div>
    </div>
</body>

</html>
